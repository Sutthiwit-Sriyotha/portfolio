name: Validate Next.js Redesign
on:
  pull_request:
    branches: [main]
  push:
    branches: [next16-interactive-redesign]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio
      - run: npm run lint